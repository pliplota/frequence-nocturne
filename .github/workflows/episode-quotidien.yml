name: Épisode quotidien

on:
  # Déclenchement automatique quotidien désormais géré en local (Tâches
  # planifiées Windows, machine toujours allumée) plutôt qu'ici, pour éviter
  # une double génération (donc un double coût API) le même jour. Le cron
  # "30 16 * * *" (18h30 Paris) a été retiré le 2026-07-24 — le
  # workflow_dispatch manuel reste en secours si besoin.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg

      - name: Générer l'épisode du jour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRIGGER_EVENT: ${{ github.event_name }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
        run: python generate_episode.py

      - name: Publier (commit + push)
        run: |
          git config user.name "frequence-nocturne-bot"
          git config user.email "actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Épisode du $(date -u +%F)"
          git push
